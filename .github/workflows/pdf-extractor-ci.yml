name: PDF Extractor Engine CI

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/pdf-extractor-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/pdf-extractor-ci.yml'
  workflow_dispatch:

jobs:
  test_extractor:
    name: PDF & OCR Ingestion Engine Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tesseract OCR System Binary
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pdfplumber pytesseract pillow pg8000

      - name: Run OCR and Scanned PDF Ingestion Test
        run: python scripts/verify_ocr.py

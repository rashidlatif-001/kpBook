name: Admin Dashboard CI

on:
  push:
    branches: [ main ]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/admin-dashboard-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/admin-dashboard-ci.yml'
  workflow_dispatch:

jobs:
  build_and_typecheck:
    name: Next.js Typecheck & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: admin-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js Dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://tsqypxgfaajwqcgtfdkq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_RQ8BvygKqcRAxmndpRt_OQ_PMtfMF6x' }}
          NODE_ENV: production
